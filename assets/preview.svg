<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="card-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#151D2E"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="window-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181F2E" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0F1420" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="green-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="violet-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Background canvas -->
  <rect width="760" height="480" rx="16" fill="url(#bg-grad)"/>

  <!-- macOS Top Menu Bar Mockup -->
  <rect x="0" y="0" width="760" height="34" fill="#0A0E17" fill-opacity="0.80"/>
  <text x="24" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0"></text>
  <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Finder</text>
  <text x="96" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="400" fill="#94A3B8">File</text>
  <text x="130" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="400" fill="#94A3B8">Edit</text>
  <text x="164" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="400" fill="#94A3B8">View</text>

  <!-- Menu Bar Right Items -->
  <g transform="translate(540, 8)">
    <!-- Active PointsWoman menu icon highlight -->
    <rect x="0" y="0" width="34" height="20" rx="4" fill="#2563EB" fill-opacity="0.3"/>
    <text x="9" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#38BDF8">🔀</text>
    <circle cx="27" cy="6" r="3" fill="#10B981"/>

    <!-- Indicators -->
    <text x="48" y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#CBD5E1">en0: Wi-Fi</text>
    <text x="120" y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#CBD5E1">100%</text>
    <text x="160" y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#CBD5E1">4:28 PM</text>
  </g>

  <!-- Little Arrow under menu bar icon pointing to window -->
  <polygon points="557,34 551,42 563,42" fill="#1E2433"/>

  <!-- Centered PointsWoman Popover Window -->
  <g transform="translate(185, 46)" filter="url(#shadow)">
    <!-- Main Window Background -->
    <rect width="390" height="410" rx="14" fill="url(#window-bg)" stroke="#334155" stroke-width="1"/>

    <!-- Window Header -->
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">🔀 PointsWoman</text>
    <rect x="145" y="19" width="44" height="18" rx="9" fill="#1E293B"/>
    <text x="153" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">v0.2</text>

    <!-- Status Badge -->
    <rect x="275" y="18" width="95" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
    <circle cx="287" cy="28" r="3.5" fill="#10B981"/>
    <text x="296" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#A7F3D0">ACTIVE · en0</text>

    <!-- Interface Selector Box -->
    <rect x="18" y="52" width="354" height="34" rx="8" fill="#111622" stroke="#1E293B" stroke-width="1"/>
    <text x="30" y="73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Physical Interface:</text>
    <text x="135" y="73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', monospace" font-size="11" font-weight="700" fill="#38BDF8">en0 (Wi-Fi 5 GHz)</text>
    <text x="345" y="73" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B">▾</text>

    <!-- Card 1: Direct Physical Bypass (Green/Emerald Glow) -->
    <g transform="translate(18, 96)">
      <rect width="354" height="106" rx="10" fill="url(#green-card)" stroke="#059669" stroke-width="1" filter="url(#card-glow)"/>
      <circle cx="20" cy="20" r="5" fill="#10B981"/>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">⚡ Physical Wi-Fi Direct Bypass (en0)</text>
      <rect x="275" y="11" width="68" height="18" rx="9" fill="#047857"/>
      <text x="283" y="23" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9" font-weight="700" fill="#ECFDF5">PAC RULE</text>

      <!-- Routed Domain Items -->
      <g transform="translate(18, 38)">
        <rect x="0" y="0" width="150" height="22" rx="4" fill="#065F46" fill-opacity="0.6"/>
        <text x="8" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#D1FAE5">chat.example.com</text>

        <rect x="158" y="0" width="155" height="22" rx="4" fill="#065F46" fill-opacity="0.6"/>
        <text x="166" y="15" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#D1FAE5">app.example.com</text>

        <rect x="0" y="28" width="150" height="22" rx="4" fill="#065F46" fill-opacity="0.6"/>
        <text x="8" y="43" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#D1FAE5">Mattermost.app</text>

        <rect x="158" y="28" width="155" height="22" rx="4" fill="#065F46" fill-opacity="0.6"/>
        <text x="166" y="43" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#D1FAE5">mail.example.com</text>
      </g>
    </g>

    <!-- Card 2: Encrypted VPN Tunnel (Violet) -->
    <g transform="translate(18, 212)">
      <rect width="354" height="66" rx="10" fill="url(#violet-card)" stroke="#6D28D9" stroke-width="1"/>
      <circle cx="20" cy="20" r="5" fill="#8B5CF6"/>
      <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" fill="#DDD6FE">🛡️ Encrypted VPN Route (utun / V2Box)</text>

      <g transform="translate(18, 36)">
        <rect x="0" y="0" width="318" height="20" rx="4" fill="#4C1D95" fill-opacity="0.5"/>
        <text x="10" y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" fill="#C4B5FD">All other traffic: Google, GitHub, YouTube, Telegram</text>
      </g>
    </g>

    <!-- Real-time Stats Pill -->
    <g transform="translate(18, 288)">
      <rect width="354" height="30" rx="6" fill="#111622" stroke="#1E293B" stroke-width="1"/>
      <circle cx="18" cy="15" r="3.5" fill="#10B981"/>
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#94A3B8">3 active</text>
      <text x="80" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#64748B">·</text>
      <text x="92" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#38BDF8">1,420 direct</text>
      <text x="175" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#64748B">·</text>
      <text x="187" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10" fill="#94A3B8">0 failed</text>
      <text x="260" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#10B981">● Socket Bound</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(18, 328)">
      <!-- Stop Button -->
      <rect x="0" y="0" width="170" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Restore &amp; Stop</text>

      <!-- Launch Direct Button -->
      <rect x="184" y="0" width="170" height="34" rx="8" fill="#2563EB" stroke="#3B82F6" stroke-width="1"/>
      <text x="220" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Launch Direct 🚀</text>
    </g>

    <!-- Tooltip Footnote -->
    <text x="24" y="388" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" fill="#64748B">💡 Selected domains bypass VPN automatically via local loopback PAC.</text>
  </g>
</svg>
