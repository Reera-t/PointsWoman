        <rect x="5.5" y="7.5" width="4" height="3" rx="1.5" stroke="#E04E39" stroke-width="1.2" fill="none"/>
        <circle cx="7" cy="9" r="0.75" fill="#E04E39"/>
        <path d="M9.5 8 C11.5 8 12.5 5.5 15 5.5" stroke="#E04E39" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <path d="M9.5 10 C11.5 10 12.5 12.5 15 12.5" stroke="#E04E39" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <polyline points="13.5 11 15 12.5 13.5 14" stroke="#E04E39" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
