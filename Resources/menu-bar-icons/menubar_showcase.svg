<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="100%" stop-color="#12151E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="380" rx="14" fill="#0E121A"/>
  
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Menu-Bar Icon Suite (18×18 pt macOS Templates)</text>
  <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#94A3B8">Stateful menu bar icons matching the 3 chosen directions: Network Switch, Tunnel Bypass, and PW Monogram</text>

  <!-- 3 Columns for the 3 Concepts -->
  
  <!-- Column 1: Network Switch -->
  <g transform="translate(32, 80)">
    <rect width="216" height="270" rx="10" fill="url(#card-bg)" stroke="#2A3245" stroke-width="1"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">2. The Network Switch</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" fill="#64748B">Mechanical slider split route</text>
    
    <!-- State 1: Inactive (Light Mode Menu Bar) -->
    <g transform="translate(16, 62)">
      <rect width="184" height="48" rx="6" fill="#F1F5F9"/>
      <g transform="translate(14, 15) scale(1)">
        <circle cx="3" cy="9" r="1.5" fill="#475569"/>
        <rect x="5.5" y="7.5" width="4" height="3" rx="1.5" stroke="#475569" stroke-width="1.2" fill="none"/>
        <circle cx="7" cy="9" r="0.75" fill="#475569"/>
        <path d="M9.5 8 C11.5 8 12.5 5.5 15 5.5" stroke="#475569" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <path d="M9.5 10 C11.5 10 12.5 12.5 15 12.5" stroke="#475569" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <polyline points="13.5 11 15 12.5 13.5 14" stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#1E293B">Inactive (Light)</text>
      <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" fill="#64748B">Proxy Stopped</text>
    </g>

    <!-- State 2: Inactive (Dark Mode Menu Bar) -->
    <g transform="translate(16, 118)">
      <rect width="184" height="48" rx="6" fill="#0A0E17"/>
      <g transform="translate(14, 15) scale(1)">
        <circle cx="3" cy="9" r="1.5" fill="#94A3B8"/>
        <rect x="5.5" y="7.5" width="4" height="3" rx="1.5" stroke="#94A3B8" stroke-width="1.2" fill="none"/>
        <circle cx="7" cy="9" r="0.75" fill="#94A3B8"/>
        <path d="M9.5 8 C11.5 8 12.5 5.5 15 5.5" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <path d="M9.5 10 C11.5 10 12.5 12.5 15 12.5" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <polyline points="13.5 11 15 12.5 13.5 14" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Inactive (Dark)</text>
      <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" fill="#64748B">macOS Dark Bar</text>
    </g>

