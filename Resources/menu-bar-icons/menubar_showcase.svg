    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">3. The Tunnel Bypass</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" fill="#64748B">Portal arch + overhead arc</text>

    <!-- State 1: Inactive (Light Mode Menu Bar) -->
    <g transform="translate(16, 62)">
      <rect width="184" height="48" rx="6" fill="#F1F5F9"/>
      <g transform="translate(14, 15) scale(1)">
        <path d="M5.5 15 L5.5 10.5 A3.5 3.5 0 0 1 12.5 10.5 L12.5 15" stroke="#475569" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <line x1="9" y1="15" x2="9" y2="11" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M2.5 13 C2.5 4.5 15.5 4.5 15.5 11" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <polyline points="13.5 9.5 15.5 11 17 9.5" stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#1E293B">Inactive (Light)</text>
      <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" fill="#64748B">Proxy Stopped</text>
    </g>

    <!-- State 2: Inactive (Dark Mode Menu Bar) -->
    <g transform="translate(16, 118)">
      <rect width="184" height="48" rx="6" fill="#0A0E17"/>
      <g transform="translate(14, 15) scale(1)">
        <path d="M5.5 15 L5.5 10.5 A3.5 3.5 0 0 1 12.5 10.5 L12.5 15" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <line x1="9" y1="15" x2="9" y2="11" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M2.5 13 C2.5 4.5 15.5 4.5 15.5 11" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <polyline points="13.5 9.5 15.5 11 17 9.5" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
