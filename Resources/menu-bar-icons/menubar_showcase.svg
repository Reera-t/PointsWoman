    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">5. The PW Monogram</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" fill="#64748B">Continuous routing ligature</text>

    <!-- State 1: Inactive (Light Mode Menu Bar) -->
    <g transform="translate(16, 62)">
      <rect width="184" height="48" rx="6" fill="#F1F5F9"/>
      <g transform="translate(14, 15) scale(1)">
        <path d="M3 14.5 L3 4.5 C3 4.5 7.5 4 7.5 7.5 C7.5 10 3 9.5 3 9.5" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M7.5 9.5 L9.5 14.5 L11.5 9.5 L13.5 14.5 L15.5 8.5" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polyline points="14 8.5 15.5 8.5 15.5 10" stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#1E293B">Inactive (Light)</text>
      <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" fill="#64748B">Proxy Stopped</text>
    </g>

    <!-- State 2: Inactive (Dark Mode Menu Bar) -->
    <g transform="translate(16, 118)">
      <rect width="184" height="48" rx="6" fill="#0A0E17"/>
      <g transform="translate(14, 15) scale(1)">
        <path d="M3 14.5 L3 4.5 C3 4.5 7.5 4 7.5 7.5 C7.5 10 3 9.5 3 9.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M7.5 9.5 L9.5 14.5 L11.5 9.5 L13.5 14.5 L15.5 8.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polyline points="14 8.5 15.5 8.5 15.5 10" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Inactive (Dark)</text>
      <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" fill="#64748B">macOS Dark Bar</text>
    </g>

    <!-- State 3: Active Bypass (Vermilion Tokyo Accent) -->
    <g transform="translate(16, 174)">
      <rect width="184" height="66" rx="6" fill="#1C1417" stroke="#E04E39" stroke-width="1"/>
      <g transform="translate(14, 15) scale(1.1)">
        <path d="M3 14.5 L3 4.5 C3 4.5 7.5 4 7.5 7.5 C7.5 10 3 9.5 3 9.5" stroke="#E04E39" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M7.5 9.5 L9.5 14.5 L11.5 9.5 L13.5 14.5 L15.5 8.5" stroke="#E04E39" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polyline points="14 8.5 15.5 8.5 15.5 10" stroke="#E04E39" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" fill="#FFA39E">Routing Active</text>
      <text x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" fill="#F87171">PW Enforced</text>
      <circle cx="170" cy="20" r="3.5" fill="#10B981"/>
    </g>
  </g>
</svg>
