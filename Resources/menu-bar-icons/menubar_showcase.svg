      <g transform="translate(14, 15) scale(1.1)">
        <path d="M5.5 15 L5.5 10.5 A3.5 3.5 0 0 1 12.5 10.5 L12.5 15" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <line x1="9" y1="15" x2="9" y2="11" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M2.5 13 C2.5 4.5 15.5 4.5 15.5 11" stroke="#E04E39" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <polyline points="13.5 9.5 15.5 11 17 9.5" stroke="#E04E39" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="46" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" fill="#FFA39E">Routing Active</text>
      <text x="46" y="40" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" fill="#F87171">Tunnel Bypassed</text>
      <circle cx="170" cy="20" r="3.5" fill="#10B981"/>
    </g>
