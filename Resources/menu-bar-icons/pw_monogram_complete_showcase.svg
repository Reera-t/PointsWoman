<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" style="background: #090D16; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151C2C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E131F" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="tokyoGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E14833"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="sageGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Filters for drop shadows -->
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#06B6D4" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ================= HEADER ================= -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="88" height="28" rx="14" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
    <text x="44" y="18" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="1">SUITE V2</text>
    
    <text x="100" y="20" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">The Tactile PW Monogram</text>
    <text x="0" y="52" font-size="14" fill="#94A3B8">Intertwined dual-route topology with origin packet node and directional bypass terminal arrow</text>
  </g>

  <!-- ================= SECTION 1: 4 COLOR PALETTES ================= -->
  <!-- 1. Warm Tokyo Dispatcher -->
  <g transform="translate(60, 115)">
    <rect width="255" height="340" rx="20" fill="url(#cardBg)" stroke="#26334D" stroke-width="1.5" filter="url(#shadowLg)"/>
    <!-- Image Box -->
    <rect x="22" y="22" width="211" height="211" rx="16" fill="#1E293B"/>
    <image href="monogram_v2_warm_tokyo.png" x="22" y="22" width="211" height="211" preserveAspectRatio="xMidYMid meet"/>
    <!-- Badge -->
    <rect x="22" y="244" width="70" height="20" rx="6" fill="#EF4444" fill-opacity="0.15"/>
    <text x="57" y="258" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">FAVORITE</text>
    <!-- Titles -->
    <text x="22" y="280" font-size="15" font-weight="700" fill="#F8FAFC">Warm Tokyo Ceramic</text>
    <text x="22" y="298" font-size="11" fill="#94A3B8">Ivory porcelain • Walnut wood rim</text>
    <!-- Swatches -->
    <circle cx="30" cy="318" r="6" fill="#FBF8F3" stroke="#D1C7B7" stroke-width="1"/>
    <circle cx="48" cy="318" r="6" fill="#42291A"/>
    <circle cx="66" cy="318" r="6" fill="#D6B06C"/>
    <circle cx="84" cy="318" r="6" fill="#E14833"/>
    <circle cx="102" cy="318" r="6" fill="#203063"/>
    <text x="120" y="322" font-size="10" fill="#64748B">Brass + Vermilion</text>
  </g>

  <!-- 2. Midnight Obsidian -->
  <g transform="translate(335, 115)">
    <rect width="255" height="340" rx="20" fill="url(#cardBg)" stroke="#26334D" stroke-width="1.5" filter="url(#shadowLg)"/>
    <rect x="22" y="22" width="211" height="211" rx="16" fill="#1E293B"/>
    <image href="monogram_v2_midnight_obsidian.png" x="22" y="22" width="211" height="211" preserveAspectRatio="xMidYMid meet"/>
    <rect x="22" y="244" width="78" height="20" rx="6" fill="#06B6D4" fill-opacity="0.15"/>
    <text x="61" y="258" font-size="10" font-weight="700" fill="#22D3EE" text-anchor="middle">CYBERPUNK</text>
    <text x="22" y="280" font-size="15" font-weight="700" fill="#F8FAFC">Midnight Obsidian</text>
    <text x="22" y="298" font-size="11" fill="#94A3B8">Carbon slate • Gunmetal bezel</text>
    <circle cx="30" cy="318" r="6" fill="#131720" stroke="#334155" stroke-width="1"/>
    <circle cx="48" cy="318" r="6" fill="#2E384D"/>
    <circle cx="66" cy="318" r="6" fill="#06B6D4"/>
    <circle cx="84" cy="318" r="6" fill="#EC4899"/>
    <text x="100" y="322" font-size="10" fill="#64748B">Cyan + Magenta</text>
  </g>

  <!-- 3. Nordic Sage & Birch -->
  <g transform="translate(610, 115)">
    <rect width="255" height="340" rx="20" fill="url(#cardBg)" stroke="#26334D" stroke-width="1.5" filter="url(#shadowLg)"/>
    <rect x="22" y="22" width="211" height="211" rx="16" fill="#1E293B"/>
    <image href="monogram_v2_nordic_sage.png" x="22" y="22" width="211" height="211" preserveAspectRatio="xMidYMid meet"/>
    <rect x="22" y="244" width="68" height="20" rx="6" fill="#10B981" fill-opacity="0.15"/>
    <text x="56" y="258" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">MINIMAL</text>
    <text x="22" y="280" font-size="15" font-weight="700" fill="#F8FAFC">Nordic Sage &amp; Birch</text>
    <text x="22" y="298" font-size="11" fill="#94A3B8">Arctic chalk • Nordic light birch</text>
    <circle cx="30" cy="318" r="6" fill="#F4F6F4" stroke="#D1D5DB" stroke-width="1"/>
    <circle cx="48" cy="318" r="6" fill="#B39E82"/>
    <circle cx="66" cy="318" r="6" fill="#387762"/>
    <circle cx="84" cy="318" r="6" fill="#D97706"/>
    <text x="100" y="322" font-size="10" fill="#64748B">Sage + Amber</text>
  </g>

  <!-- 4. Kyoto Imperial Indigo -->
  <g transform="translate(885, 115)">
    <rect width="255" height="340" rx="20" fill="url(#cardBg)" stroke="#26334D" stroke-width="1.5" filter="url(#shadowLg)"/>
    <rect x="22" y="22" width="211" height="211" rx="16" fill="#1E293B"/>
    <image href="monogram_v2_kyoto_indigo.png" x="22" y="22" width="211" height="211" preserveAspectRatio="xMidYMid meet"/>
    <rect x="22" y="244" width="70" height="20" rx="6" fill="#F59E0B" fill-opacity="0.15"/>
    <text x="57" y="258" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">KINTSUGI</text>
    <text x="22" y="280" font-size="15" font-weight="700" fill="#F8FAFC">Kyoto Imperial Navy</text>
    <text x="22" y="298" font-size="11" fill="#94A3B8">Glazed indigo • 24K leaf gold</text>
    <circle cx="30" cy="318" r="6" fill="#1A2447"/>
    <circle cx="48" cy="318" r="6" fill="#F59E0B"/>
    <circle cx="66" cy="318" r="6" fill="#FCD34D"/>
    <circle cx="84" cy="318" r="6" fill="#EF4444"/>
    <text x="100" y="322" font-size="10" fill="#64748B">Gold + Coral</text>
  </g>

  <!-- ================= SECTION 2: MENU-BAR ICONS (LIGHT & DARK SIMULATION) ================= -->
  <g transform="translate(60, 485)">
    <text x="0" y="22" font-size="20" font-weight="700" fill="#F8FAFC">Menu-Bar Icon Integration (macOS Sequoia UI Simulation)</text>
    <text x="0" y="44" font-size="13" fill="#94A3B8">Pixel-aligned 18×18 pt geometry rendered with native template auto-tinting and active state signaling</text>

    <!-- MOCKUP A: macOS LIGHT MODE MENU BAR -->
    <g transform="translate(0, 65)">
      <!-- Desktop Wallpaper Background (Light Soft Gradient) -->
      <rect width="1080" height="150" rx="14" fill="#3B82F6" fill-opacity="0.2"/>
      <image href="" width="1080" height="150" preserveAspectRatio="none"/>

      <!-- Menu Bar Strip (Frosted Light) -->
      <rect width="1080" height="32" rx="14" fill="#F3F4F6" fill-opacity="0.88" stroke="#E5E7EB" stroke-width="1"/>
      <rect y="20" width="1080" height="12" fill="#F3F4F6" fill-opacity="0.88"/>

      <!-- Left: Apple Logo & App Menus -->
      <path d="M 24 16.5 C 24 13.5, 26 12, 26 12 C 25 10.5, 23 10.5, 22.5 10.5 C 20.5 10.5, 19.5 11.8, 18.5 11.8 C 17.5 11.8, 16 10.5, 14.5 10.5 C 12.5 10.5, 10.5 12.2, 10.5 15.5 C 10.5 18, 12 21.5, 13.5 23.5 C 14.5 24.8, 15.5 26, 17 26 C 18.2 26, 18.8 25, 20.5 25 C 22 25, 22.5 26, 24 26 C 25.5 26, 26.5 24.5, 27.5 23 C 28.5 21.5, 29 20, 29 20 C 29 20, 26.5 18.8, 26.5 16 C 26.5 13.8, 28.2 12.6, 28.5 12.5 C 27.2 10.8, 25.2 10.5, 24.8 10.5" fill="#1F2937" transform="translate(4, -4) scale(0.65)"/>
      <text x="36" y="21" font-size="13" font-weight="700" fill="#111827">PointsWoman</text>
      <text x="135" y="21" font-size="13" fill="#374151">File</text>
      <text x="170" y="21" font-size="13" fill="#374151">Edit</text>
      <text x="205" y="21" font-size="13" fill="#374151">View</text>
      <text x="248" y="21" font-size="13" fill="#374151">Window</text>

      <!-- Right Menu Extras -->
      <!-- Inactive Template PW Icon -->
      <g transform="translate(730, 7)">
        <rect x="-8" y="-3" width="34" height="24" rx="5" fill="#E5E7EB" fill-opacity="0.6"/>
        <!-- 18x18 Template Icon (Dark charcoal) -->
        <circle cx="3.2" cy="12.8" r="1.3" fill="#1F2937"/>
        <path d="M3.2 12.8 V4.8 C3.2 4.8 7.8 4.8 7.8 7.2 C7.8 9.5 3.2 9.5 3.2 9.5" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M5.6 9.5 C6.2 9.5 7.0 13.2 7.8 13.2 C8.6 13.2 9.2 8.8 10.0 8.8 C10.8 8.8 11.4 13.2 12.2 13.2 C13.0 13.2 13.8 7.5 14.8 5.5" stroke="#1F2937" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polyline points="12.4 5.5 14.8 5.5 14.8 7.9" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="715" y="30" font-size="9" fill="#6B7280" text-anchor="end">Idle (Template)</text>

      <!-- Active Running PW Icon -->
      <g transform="translate(805, 7)">
        <rect x="-8" y="-3" width="34" height="24" rx="5" fill="#DBEAFE"/>
        <circle cx="3.2" cy="12.8" r="1.3" fill="#E14833"/>
        <path d="M3.2 12.8 V4.8 C3.2 4.8 7.8 4.8 7.8 7.2 C7.8 9.5 3.2 9.5 3.2 9.5" stroke="#E14833" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M5.6 9.5 C6.2 9.5 7.0 13.2 7.8 13.2 C8.6 13.2 9.2 8.8 10.0 8.8 C10.8 8.8 11.4 13.2 12.2 13.2 C13.0 13.2 13.8 7.5 14.8 5.5" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polyline points="12.4 5.5 14.8 5.5 14.8 7.9" stroke="#E14833" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- Active green badge dot -->
        <circle cx="16" cy="3" r="2.5" fill="#10B981" stroke="#F3F4F6" stroke-width="1"/>
      </g>
      <text x="850" y="21" font-size="11" font-weight="700" fill="#1D4ED8">Active Route</text>

      <!-- Standard macOS System Extras -->
      <g transform="translate(930, 8)" stroke="#374151" stroke-width="1.4" fill="none">
        <!-- Wi-Fi -->
        <path d="M0 12 A12 12 0 0 1 14 12 M2.5 14 A8 8 0 0 1 11.5 14 M6 16 A2 2 0 0 1 8 16"/>
        <!-- Battery -->
        <rect x="22" y="4" width="20" height="10" rx="2"/>
        <rect x="24" y="6" width="14" height="6" fill="#374151"/>
        <line x1="43" y1="7" x2="43" y2="11"/>
      </g>
      <!-- Clock -->
      <text x="1000" y="21" font-size="12" font-weight="500" fill="#111827">Sun 5:35 PM</text>

      <!-- Label Banner -->
      <rect x="18" y="105" width="240" height="28" rx="8" fill="#1E293B" fill-opacity="0.9"/>
      <text x="28" y="124" font-size="12" font-weight="700" fill="#F8FAFC">☀️ macOS Light Mode Appearance</text>
    </g>

    <!-- MOCKUP B: macOS DARK MODE MENU BAR -->
    <g transform="translate(0, 235)">
      <!-- Desktop Wallpaper Background (Dark Cosmic Gradient) -->
      <rect width="1080" height="150" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>

      <!-- Menu Bar Strip (Frosted Dark) -->
      <rect width="1080" height="32" rx="14" fill="#18181B" fill-opacity="0.88" stroke="#27272A" stroke-width="1"/>
      <rect y="20" width="1080" height="12" fill="#18181B" fill-opacity="0.88"/>

      <!-- Left: Apple Logo & App Menus -->
      <path d="M 24 16.5 C 24 13.5, 26 12, 26 12 C 25 10.5, 23 10.5, 22.5 10.5 C 20.5 10.5, 19.5 11.8, 18.5 11.8 C 17.5 11.8, 16 10.5, 14.5 10.5 C 12.5 10.5, 10.5 12.2, 10.5 15.5 C 10.5 18, 12 21.5, 13.5 23.5 C 14.5 24.8, 15.5 26, 17 26 C 18.2 26, 18.8 25, 20.5 25 C 22 25, 22.5 26, 24 26 C 25.5 26, 26.5 24.5, 27.5 23 C 28.5 21.5, 29 20, 29 20 C 29 20, 26.5 18.8, 26.5 16 C 26.5 13.8, 28.2 12.6, 28.5 12.5 C 27.2 10.8, 25.2 10.5, 24.8 10.5" fill="#F4F4F5" transform="translate(4, -4) scale(0.65)"/>
      <text x="36" y="21" font-size="13" font-weight="700" fill="#FFFFFF">PointsWoman</text>
      <text x="135" y="21" font-size="13" fill="#D4D4D8">File</text>
      <text x="170" y="21" font-size="13" fill="#D4D4D8">Edit</text>
      <text x="205" y="21" font-size="13" fill="#D4D4D8">View</text>
      <text x="248" y="21" font-size="13" fill="#D4D4D8">Window</text>

      <!-- Right Menu Extras -->
      <!-- Inactive Template PW Icon -->
      <g transform="translate(730, 7)">
        <rect x="-8" y="-3" width="34" height="24" rx="5" fill="#27272A" fill-opacity="0.6"/>
        <circle cx="3.2" cy="12.8" r="1.3" fill="#FFFFFF"/>
        <path d="M3.2 12.8 V4.8 C3.2 4.8 7.8 4.8 7.8 7.2 C7.8 9.5 3.2 9.5 3.2 9.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M5.6 9.5 C6.2 9.5 7.0 13.2 7.8 13.2 C8.6 13.2 9.2 8.8 10.0 8.8 C10.8 8.8 11.4 13.2 12.2 13.2 C13.0 13.2 13.8 7.5 14.8 5.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polyline points="12.4 5.5 14.8 5.5 14.8 7.9" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="715" y="30" font-size="9" fill="#94A3B8" text-anchor="end">Idle (White Template)</text>

      <!-- Active Running PW Icon (Glowing Vermilion & Indigo) -->
      <g transform="translate(805, 7)">
        <rect x="-8" y="-3" width="34" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="3.2" cy="12.8" r="1.3" fill="#FF5733"/>
        <path d="M3.2 12.8 V4.8 C3.2 4.8 7.8 4.8 7.8 7.2 C7.8 9.5 3.2 9.5 3.2 9.5" stroke="#FF5733" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M5.6 9.5 C6.2 9.5 7.0 13.2 7.8 13.2 C8.6 13.2 9.2 8.8 10.0 8.8 C10.8 8.8 11.4 13.2 12.2 13.2 C13.0 13.2 13.8 7.5 14.8 5.5" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polyline points="12.4 5.5 14.8 5.5 14.8 7.9" stroke="#FF5733" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="16" cy="3" r="2.5" fill="#10B981" stroke="#18181B" stroke-width="1"/>
      </g>
      <text x="850" y="21" font-size="11" font-weight="700" fill="#60A5FA">Active Route</text>

      <!-- Standard macOS System Extras -->
      <g transform="translate(930, 8)" stroke="#E4E4E7" stroke-width="1.4" fill="none">
        <path d="M0 12 A12 12 0 0 1 14 12 M2.5 14 A8 8 0 0 1 11.5 14 M6 16 A2 2 0 0 1 8 16"/>
        <rect x="22" y="4" width="20" height="10" rx="2"/>
        <rect x="24" y="6" width="14" height="6" fill="#E4E4E7"/>
        <line x1="43" y1="7" x2="43" y2="11"/>
      </g>
      <text x="1000" y="21" font-size="12" font-weight="500" fill="#FFFFFF">Sun 5:35 PM</text>

      <!-- Label Banner -->
      <rect x="18" y="105" width="235" height="28" rx="8" fill="#18181B" fill-opacity="0.9" stroke="#27272A" stroke-width="1"/>
      <text x="28" y="124" font-size="12" font-weight="700" fill="#F8FAFC">🌙 macOS Dark Mode Appearance</text>
    </g>
  </g>
</svg>
